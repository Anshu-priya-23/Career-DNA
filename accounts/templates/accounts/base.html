<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CareerDNA{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182338;font:16px/1.6 system-ui,sans-serif}a{color:#2454b8}nav{background:white;border-bottom:1px solid #dde3eb}nav .nav-inner{max-width:940px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:20px}.brand{font-weight:750;color:#182338;text-decoration:none;margin-right:auto}nav form{margin:0}main{max-width:860px;margin:auto;padding:40px 24px 64px}h1{font-size:clamp(27px,5vw,36px);line-height:1.2;margin:0 0 12px;letter-spacing:-.8px}h2{font-size:23px;line-height:1.35;margin:0 0 16px}h3{font-size:18px;line-height:1.4;margin:0 0 10px}p{margin:8px 0 16px}.muted,small{color:#536176}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.3px;text-transform:uppercase;color:#2454b8;margin-bottom:8px}.card{background:white;border:1px solid #dde3eb;border-radius:16px;padding:28px;margin:24px 0}label{display:block;font-weight:600;margin-bottom:6px}input,textarea,button{font:inherit}input:not([type=checkbox]),textarea{width:100%;max-width:100%;background:white;color:#182338;border:1px solid #a7b3c4;border-radius:8px;padding:11px 13px}textarea{resize:vertical}input[type=file]{padding:14px;background:#f8fafc}input[type=checkbox]{width:19px;height:19px;accent-color:#2454b8;flex-shrink:0}button,.button{display:inline-block;background:#2454b8;color:white;border:0;border-radius:8px;padding:11px 19px;font-weight:650;text-decoration:none;cursor:pointer}button.secondary{background:#edf1f7;color:#243751}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid #75a8f8;outline-offset:3px}.field{margin:18px 0}.errorlist,.error{color:#a32636}.errorlist{padding-left:20px}.status{border-radius:8px;padding:12px 16px;background:#eaf1ff}.status.success{background:#e8f6ef;color:#166044}.status.error{background:#fceef0}.status:empty{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.improvement{border-top:1px solid #e5eaf0;padding:20px 0}.improvement:last-child{padding-bottom:0}.improvement p:last-child{margin-bottom:0}blockquote{border-left:3px solid #c4d6f6;background:#f6f8fc;margin:12px 0;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.gap{padding:16px 0;border-top:1px solid #e5eaf0}.tag{font-size:12px;color:#536176;margin-left:8px}.known{display:flex;gap:10px;align-items:center;font-weight:500;margin:14px 0}.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:20px 0;border-top:1px solid #e5eaf0}.task-label{display:flex;align-items:flex-start;gap:12px}.task-body{flex:1;min-width:0}.task-body p{font-weight:400;margin:6px 0}.task-body small{font-weight:400}progress{width:100%;height:8px;accent-color:#2454b8}.task-label:has(input:checked) h3{color:#536176;text-decoration:line-through}details summary{cursor:pointer;font-weight:600}footer{color:#536176;font-size:13px;margin-top:30px}.steps{display:flex;gap:20px;margin:24px 0;color:#536176;font-size:14px}#learning-inputs[hidden]{display:none}@media(max-width:600px){main{padding:28px 16px}.card{padding:20px}.grid{grid-template-columns:1fr;gap:0}nav .nav-inner{padding:14px 16px;gap:12px}nav .username{display:none}.steps{gap:12px;font-size:13px}}
</style>{% block head %}{% endblock %}</head><body><nav><div class="nav-inner"><a class="brand" href="{% url 'discovery' %}">CareerDNA</a><span class="username">{{ request.user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Log out</button></form></div></nav><main>{% block content %}{% endblock %}<footer>Use only details you can honestly support. A review or study plan does not guarantee selection.</footer></main>{% block scripts %}{% endblock %}</body></html>
